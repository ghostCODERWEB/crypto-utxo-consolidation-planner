[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-utxo-consolidation-planner"
version = "0.1.0"
description = "Compare immediate consolidation cost against future input savings and privacy-cluster restrictions."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-utxo-consolidation-planner = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
